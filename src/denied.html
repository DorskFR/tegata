<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}} · tegata</title>
<style>
:root{--bg:#f6f7f9;--elev:#fff;--text:#1a1d23;--muted:#5b6472;--border:#d9dde3;--accent:#0b5cad;--ink:#fff;--warn:#9a5b00;--warn-bg:#fdf3e2;--warn-border:#efd3a1;--shadow:0 1px 2px #14181f14;
--sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono","Fira Code",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--elev:#171a21;--text:#e6e9ef;--muted:#9aa3b2;--border:#2c323d;--accent:#4cc3f0;--ink:#04130c;--warn:#f0b75c;--warn-bg:#2a2112;--warn-border:#5a4520;--shadow:0 1px 2px #0006}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);background:var(--elev)}
header svg{width:24px;height:24px}
header span{font-weight:650;letter-spacing:-.01em}
main{flex:1;display:grid;place-items:center;padding:2rem 1rem}
.card{width:100%;max-width:30rem;background:var(--elev);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:1.75rem}
.eyebrow{display:inline-flex;align-items:center;gap:.4rem;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:999px;padding:.2rem .6rem}
.eyebrow svg{width:13px;height:13px}
h1{font-size:1.35rem;line-height:1.3;letter-spacing:-.015em;margin:.9rem 0 .5rem}
p{margin:0;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.45rem .9rem;margin:1.25rem 0 0;padding:1rem 0 0;border-top:1px solid var(--border)}
dl:empty{display:none}
dt{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;align-self:center}
dd{margin:0;font-family:var(--mono);font-size:.85rem;overflow-wrap:anywhere}
.hint{margin-top:1.25rem;padding:.8rem 1rem;border-radius:10px;background:var(--bg);border:1px solid var(--border);font-size:.9rem}
.hint strong{color:var(--text)}
footer{padding:1rem;text-align:center;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 11h14M16 11v11M12 22h8" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
<span>tegata</span>
</header>
<main>
<section class="card">
<span class="eyebrow"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 7V5a3 3 0 0 1 6 0v2M4 7h8v6H4z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></svg>403 · access refused</span>
<h1>{{TITLE}}</h1>
<p>{{DETAIL}}</p>
<dl>{{FACTS}}</dl>
<div class="hint">{{HINT}}</div>
</section>
</main>
<footer>Checked by tegata, which manages the client certificates for this site.</footer>
</body>
</html>
